<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Có điều gì đó đang chờ em...</title>
    <meta name="description" content="Một bí mật ngọt ngào đang chờ em khám phá...">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/puzzle.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="container" id="mainContainer">
        <div class="card" id="puzzleCard">
            <div class="lock-wrap">
                <div class="lock" id="lockIcon">🔐</div>
            </div>
            <h1 class="title">Có một điều bí mật<br>đang chờ em...</h1>
            <p class="subtitle">Em có nhớ ngày đặc biệt nhất của mình không? 💕</p>
            <div class="input-group">
                <input
                    type="text"
                    id="dateInput"
                    placeholder="DD/MM/YYYY"
                    maxlength="10"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="unlockBtn">
                    <span>Mở khóa</span>
                    <span class="btn-icon">💖</span>
                </button>
            </div>
            <p class="hint">✨ Gợi ý: Ngày em chào đời và trở thành người đặc biệt nhất của anh...</p>
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>

    <!-- Success overlay -->
    <div class="success-overlay" id="successOverlay">
        <canvas id="celebCanvas"></canvas>
        <div class="success-content">
            <div class="success-emoji" id="successEmoji">🎉</div>
            <h2 class="success-title">Chính xác rồi!</h2>
            <p class="success-sub">Happy Birthday Pé Thúi yêu của anh! 🎂❤️</p>
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
            <p class="loading-text">Đang chuẩn bị bữa tiệc sinh nhật...</p>
        </div>
    </div>

    <script src="./style/script/puzzle.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing 3D Heart (ExtrudeGeometry)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510; /* Màu nền vũ trụ tối */
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Import Three.js và các addons cần thiết qua ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. Khởi tạo Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Cài đặt Post-processing (Hiệu ứng phát sáng - Bloom)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            2.0,  // Cường độ sáng (strength) - tăng để rực rỡ hơn
            0.5,  // Bán kính sáng (radius)
            0.2   // Ngưỡng sáng (threshold) - hạ thấp để dễ phát sáng
        );
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 3. Tạo hình trái tim 2D (Shape)
        const x = 0, y = 0;
        const heartShape = new THREE.Shape();
        heartShape.moveTo( x + 25, y + 25 );
        heartShape.bezierCurveTo( x + 25, y + 25, x + 20, y, x, y );
        heartShape.bezierCurveTo( x - 30, y, x - 30, y + 35, x - 30, y + 35 );
        heartShape.bezierCurveTo( x - 30, y + 55, x - 10, y + 77, x + 25, y + 95 );
        heartShape.bezierCurveTo( x + 60, y + 77, x + 80, y + 55, x + 80, y + 35 );
        heartShape.bezierCurveTo( x + 80, y + 35, x + 80, y, x + 50, y );
        heartShape.bezierCurveTo( x + 35, y, x + 25, y + 25, x + 25, y + 25 );

        // 4. Tạo khối 3D bằng ExtrudeGeometry
        const extrudeSettings = { 
            depth: 20,          // Độ dày của khối
            bevelEnabled: true, // Bật vát cạnh để khối trông mềm mại
            bevelSegments: 8,   // Số phân đoạn vát cạnh (càng cao càng mịn)
            steps: 2,           // Số bước đùn
            bevelSize: 6,       // Kích thước vát
            bevelThickness: 6   // Độ dày phần vát
        };
        const heartGeo = new THREE.ExtrudeGeometry( heartShape, extrudeSettings );

        // Đưa tâm của khối trái tim về gốc tọa độ (0, 0, 0)
        heartGeo.computeBoundingBox();
        const bBox = heartGeo.boundingBox;
        heartGeo.translate( 
            -0.5 * (bBox.max.x + bBox.min.x), 
            -0.5 * (bBox.max.y + bBox.min.y), 
            -0.5 * (bBox.max.z + bBox.min.z) 
        );
        heartGeo.rotateX( Math.PI ); // Lật ngược lại do hệ tọa độ Canvas và 3D khác nhau

        // 5. Tạo vật liệu phát sáng đỏ rực
        const heartMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0033,       // Đỏ rực
            emissive: 0xff0022,    // Màu tự phát sáng (đỏ)
            emissiveIntensity: 1.2,// Cường độ phát sáng mạnh
            roughness: 0.1,        // Bề mặt bóng
            metalness: 0.3         // Bắt sáng nhẹ như kim loại
        });
        const heartMesh = new THREE.Mesh(heartGeo, heartMat);
        scene.add(heartMesh);

        // 6. Thêm ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 50, 50);
        scene.add(dirLight);
        
        // Thêm một đèn màu hồng chiếu từ dưới lên
        const pointLight = new THREE.PointLight(0xff3366, 2, 300);
        pointLight.position.set(0, -50, 20);
        scene.add(pointLight);

        // 7. Điều khiển Camera (OrbitControls)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; // Trái tim tự động xoay
        controls.autoRotateSpeed = 2.5;

        // 8. Xử lý khi thay đổi kích thước cửa sổ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. Vòng lặp Render
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            // Dùng composer để render kèm hiệu ứng Bloom
            composer.render();
        }
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday Linh Thúi!</title>
    <meta name="description" content="Happy Birthday Pé Thúi yêu của anh! 🎂❤️">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/birthday.css">
</head>
<body>
    <canvas id="rainCanvas"></canvas>
    <canvas class="canvas"></canvas>
    <canvas id="fireCanvas"></canvas>
    <audio id="sound" loop preload="auto">
        <source src="./style/Chăm Hoa.mp3" type="audio/mpeg" />
    </audio>
    <script src="./style/script/rain_bday.js"></script>
    <script src="./style/script/fire_bday.js"></script>

    <!-- Silently preload gallery images in background while watching fireworks -->
    <script>
        window.addEventListener('load', () => {
            const preloadList = [
                './images/1.jpg', './images/2.jpg', './images/3.png', './images/4.png',
                './images/5.png', './images/6.png', './images/7.jpg', './images/8.png',
                './images/9.jpg', './images/10.jpg', './images/11.jpg', './images/12.jpg',
                './images/intro3.gif', './images/moon03.gif', './images/intro04.gif'
            ];
            setTimeout(() => {
                preloadList.forEach(src => {
                    const img = new Image();
                    img.decoding = 'async';
                    img.src = src;
                });
            }, 800);
        });
    </script>
</body>
</html>
